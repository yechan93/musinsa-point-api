point:
  max-credit-per-once: 100000   # 1회 최대 적립 한도
  max-balance-per-user: 500000  # 개인별 최대 보유 한도
  default-expire-days: 365      # 기본 만료일 (일 단위)

spring:
  datasource:
    url: jdbc:h2:mem:pointdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create